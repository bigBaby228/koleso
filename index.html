<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Колесо</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=0.18">
</head>
<body>
<div class="app" id="app">
  <div class="tg-top">
    <button class="x" onclick="UI.toast('В Telegram здесь закрывается мини-приложение')">✕ Закрыть</button>
    <div class="title">Колесо<small>мини-приложение</small></div>
    <button class="dots" onclick="UI.toast('Меню мини-приложения')">⋯</button>
  </div>

  <!-- СТАРТ -->
  <div class="screen" id="scrStart">
    <div class="start">
      <button class="gear" onclick="UI.showSettings()" aria-label="Настройки">⚙</button>
      <div class="logo">🎡</div>
      <h1>Колесо</h1>
      <p class="sub">Вырвись из гонки за зарплатой и купи мечту первым.</p>
      <div id="contBox"></div>
      <div id="onBox" style="margin-top:10px"></div>
      <div class="lbl">Сложность</div>
      <div class="seg" id="diffSeg"></div>
      <div class="diffnote" id="diffNote"></div>
      <div class="lbl">Профессия</div>
      <div class="seg" id="modeSeg"></div>
      <div id="profList"></div>
      <button class="b sec" style="width:100%;margin-top:12px" onclick="UI.startTutorial()">Обучение · 2 минуты</button>
      <div class="startbtns"><button class="b sec" onclick="UI.showRules()">Правила</button><button class="b sec" onclick="UI.showAch()" id="achBtn">Достижения</button></div>
      <button class="b sec" style="width:100%" onclick="UI.showShop()" id="shopBtn">Магазин</button>
      <details class="qh" style="margin-top:12px"><summary>Для теста</summary><div>
        <button class="testlink" onclick="UI.debugMid()">Сразу на средний круг</button>
        <button class="testlink" style="margin-top:4px" onclick="UI.debugFast()">Сразу в Большую игру</button>
        <button class="testlink" style="margin-top:4px" onclick="UI.testCoins()">+1000 КолесоКоинов</button></div></details>
      <div style="text-align:center;font-size:11px;color:var(--hint);margin-top:10px;opacity:.7">Версия 0.18 · 24.11.2026</div>
    </div>
  </div>

  <!-- ЛОББИ -->
  <div class="screen hidden" id="scrLobby"><div class="start" id="lobby"></div></div>

  <!-- ИГРА -->
  <div class="screen hidden" id="scrGame">
    <div class="hud">
      <div class="hud-row">
        <button class="gear hudgear" onclick="UI.showSettings()" aria-label="Настройки">⚙</button>
        <div class="ava" id="hAva">🛵</div>
        <div class="who"><b id="hProf"></b><span id="hMode"></span><br>Ход <span id="hTurn">0</span> · <span id="hDiff"></span></div>
        <div class="stat" id="cashBox"><div class="v" id="hCash">$0</div><div class="l">наличные</div></div>
        <div class="stat stat2"><div class="v" id="hFlow">$0</div><div class="l" id="hFlowL">поток / мес</div></div>
      </div>
      <div class="free">
        <div class="free-top"><span id="hGoalTxt"></span><b id="hPct">0%</b></div>
        <div class="bar"><i id="hBar" style="width:0%"></i></div>
        <div class="free-sub" id="hGoalSub"></div>
        <div class="slots" id="hSlots"></div>
        <div class="advice" id="hAdvice"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-v="board">Поле</button>
      <button class="tab" data-v="ex">Биржа <span class="badge hidden" id="exbadge">0</span></button>
      <button class="tab" data-v="edu">Учёба</button>
      <button class="tab" data-v="report">Отчёт</button>
      <button class="tab" data-v="chat">Чат <span class="badge hidden" id="badge">0</span></button>
    </div>
    <div class="view" id="v-board">
      <div class="newsbar" id="newsbar" onclick="UI.switchView('ex')"></div>
      <div class="tablewrap" id="tableWrap"></div>
    </div>
    <div class="view hidden" id="v-ex"><div class="ex" id="ex"></div></div>
    <div class="view hidden" id="v-edu"><div class="rep" id="edu"></div></div>
    <div class="view hidden" id="v-report"><div class="rep" id="rep"></div></div>
    <div class="view hidden" id="v-chat"><div class="chat" id="chat"></div></div>
    <button class="mainbtn" id="rollBtn">🎲 Бросить кубик</button>
  </div>

  <div class="shade" id="shade"></div>
  <div class="sheet" id="sheet"></div>
  <div class="win hidden" id="win"></div>
  <div class="coach hidden" id="coach"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="sound.js?v=0.18"></script>
<script src="config.js?v=0.18"></script>
<script src="data.js?v=0.18"></script>
<script src="engine.js?v=0.18"></script>
<script src="table.js?v=0.18"></script>
<script src="ui.js?v=0.18"></script>
</body>
</html>
